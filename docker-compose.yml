services:
  backend:
    build: ./backend
    container_name: backend_service
    ports:
      - "8001:8001"
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --reload --port 8001

  frontend:
    build: ./frontend
    container_name: frontend_service
    ports:
      - "8000:8000"
    volumes:
      - ./frontend:/app
    command: python3 manage.py runserver 0.0.0.0:8000
